# Render Blueprint for the backend API (the frontend is hosted by Ember AI, like Trustail).
# Dashboard -> New -> Blueprint -> pick this repo. `sync: false` values are entered in the dashboard.
services:
  - type: web
    name: painbridge-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: APP_ENV
        value: production
      - key: MONGODB_URI # Atlas connection string; leave blank for in-memory demo mode
        sync: false
      - key: MONGODB_DB
        value: painbridge
      - key: JWT_SECRET
        generateValue: true
      - key: LITELLM_TOKEN # Duke AI Gateway key
        sync: false
      - key: LITELLM_MODEL
        value: Mistral on-site
      - key: CORS_ORIGINS # your Ember app URL(s), comma-separated, e.g. https://painbridge.example.com,http://localhost:3000
        sync: false
